<div class="sidebar-backdrop"></div>
<nav class="sidebar">
  <div class="brand">
    <span class="ticker-dot"></span>
    <span>StockFolio</span>
  </div>

  {% if session.get('role') == 'admin' %}
    <div class="nav-section-label">Admin</div>
    <a href="{{ url_for('admin.dashboard') }}" class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>Admin Dashboard
    </a>
    <a href="{{ url_for('admin.users') }}" class="nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}">
      <i class="bi bi-people"></i>Manage Users
    </a>
    <a href="{{ url_for('admin.stocks') }}" class="nav-link {% if request.endpoint == 'admin.stocks' %}active{% endif %}">
      <i class="bi bi-graph-up-arrow"></i>Manage Stocks
    </a>
    <a href="{{ url_for('admin.transactions') }}" class="nav-link {% if request.endpoint == 'admin.transactions' %}active{% endif %}">
      <i class="bi bi-receipt"></i>Transactions
    </a>
    <a href="{{ url_for('admin.reports') }}" class="nav-link {% if request.endpoint == 'admin.reports' %}active{% endif %}">
      <i class="bi bi-bar-chart-line"></i>Reports
    </a>
    <div class="nav-section-label">My Account</div>
    <a href="{{ url_for('dashboard.index') }}" class="nav-link">
      <i class="bi bi-person-circle"></i>User View
    </a>
  {% else %}
    <div class="nav-section-label">Menu</div>
    <a href="{{ url_for('dashboard.index') }}" class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>Dashboard
    </a>
    <a href="{{ url_for('portfolio.index') }}" class="nav-link {% if request.endpoint == 'portfolio.index' %}active{% endif %}">
      <i class="bi bi-briefcase"></i>Portfolio
    </a>
    <a href="{{ url_for('watchlist.index') }}" class="nav-link {% if request.endpoint == 'watchlist.index' %}active{% endif %}">
      <i class="bi bi-eye"></i>Watchlist
    </a>
    <a href="{{ url_for('analysis.index') }}" class="nav-link {% if request.endpoint and request.endpoint.startswith('analysis.') %}active{% endif %}">
      <i class="bi bi-search"></i>Stock Analysis
    </a>
  {% endif %}

  <div class="nav-section-label">Account</div>
  <a href="{{ url_for('auth.logout') }}" class="nav-link">
    <i class="bi bi-box-arrow-right"></i>Logout
  </a>
</nav>
