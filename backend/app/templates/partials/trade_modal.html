<div class="modal fade" id="tradeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="tradeForm" method="POST" action="">
        <div class="modal-header">
          <h5 class="modal-title" id="tradeModalTitle">Trade Stock</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="stock_id" id="tradeStockId">
          <input type="hidden" id="tradePriceHidden">
          <input type="hidden" id="tradeAction">

          <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-light rounded">
            <span class="ticker-badge fs-5" id="tradeTicker">—</span>
            <span class="text-muted">Current Price: <strong>₹<span id="tradePrice">0.00</span></strong></span>
          </div>

          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" id="tradeQuantity" class="form-control" min="1" value="1" required>
          </div>

          <div class="d-flex justify-content-between border-top pt-2">
            <span class="text-muted">Total Amount</span>
            <strong>₹<span id="tradeTotal">0.00</span></strong>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success" id="tradeSubmitBtn">Confirm</button>
        </div>
      </form>
    </div>
  </div>
</div>
